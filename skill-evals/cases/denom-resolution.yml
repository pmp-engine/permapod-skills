name: denom_resolution
description: User uses human-readable asset names that must be resolved
queries:
  - "stZIG lending rate"
  - "What's the borrow rate for USDC?"
  - "ZIG market detail"
  - "Show me the zig market"
expected:
  command: market
  invariant: "Denom shortcuts MUST be resolved before passing to the command"
  resolution_map:
    ZIG: uzig
    zig: uzig
    stZIG: "coin.zig109f7g2rzl2aqee7z6gffn8kfe9cpqx0mjkk7ethmx8m2hq4xpe9snmaam2.stzig"
    USDC: "ibc/6490A7EAB61059BFC1CDDEB05917DD70BDF3A611654162A1A47DB930D40D8AF4"
    usdc: "ibc/6490A7EAB61059BFC1CDDEB05917DD70BDF3A611654162A1A47DB930D40D8AF4"
  must_not_do:
    - "Pass 'ZIG' as raw string to the CLI"
    - "Ask the user for the raw denom string"
