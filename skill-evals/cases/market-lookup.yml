name: market_lookup
description: User asks about a specific asset's lending market
queries:
  - "What are the lending rates for ZIG?"
  - "Show me the ZIG market"
  - "stZIG market detail"
  - "What's the borrow APY for USDC?"
expected:
  command: market
  args: ["<denom>"]
  denom_resolution:
    ZIG: uzig
    stZIG: "coin.zig109f7g2rzl2aqee7z6gffn8kfe9cpqx0mjkk7ethmx8m2hq4xpe9snmaam2.stzig"
    USDC: "ibc/6490A7EAB61059BFC1CDDEB05917DD70BDF3A611654162A1A47DB930D40D8AF4"
  must_include_in_output:
    - "Supply APY"
    - "Borrow APY"
    - "Utilization"
  must_not_call:
    - dashboard
    - wallet
