name: protocol_overview
description: User asks about overall protocol health or TVL
queries:
  - "What's the current TVL on Perma Pod?"
  - "Give me a protocol overview for Zigchain"
  - "How is the Perma Pod protocol doing?"
  - "Show me the Perma Pod dashboard"
expected:
  command: dashboard
  flags: []
  must_include_in_output:
    - "TVL"
    - "Total Borrowed"
    - "Utilization"
  must_not_call:
    - wallet
    - market
    - accounts
